name: Create SSM parameter

on:
  workflow_dispatch:
    inputs:
      parameter_name:
        description: Parameter name (e.g. domino-api-key)
        required: true
        default: domino-api-key
      region:
        description: AWS region
        required: false
        default: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  create-parameter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ inputs.region }}

      - name: Put SecureString parameter
        id: parameter
        env:
          PARAMETER_NAME: ${{ inputs.parameter_name }}
          REGION: ${{ inputs.region }}
          PARAMETER_VALUE: ${{ secrets.DOMINO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PARAMETER_VALUE" ]; then
            echo "::error::DOMINO_API_KEY repo secret is not set. Add it first: gh secret set DOMINO_API_KEY"
            exit 1
          fi
          echo "::add-mask::$PARAMETER_VALUE"
          aws ssm put-parameter \
            --name "$PARAMETER_NAME" \
            --value "$PARAMETER_VALUE" \
            --type SecureString \
            --region "$REGION" \
            --overwrite
          echo "Parameter ready: $PARAMETER_NAME ($REGION)"
