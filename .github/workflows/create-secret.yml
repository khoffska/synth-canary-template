name: Create Secrets Manager secret

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Secret name (e.g. domino-api-key)
        required: true
        default: domino-api-key
      secret_json_key:
        description: Optional JSON key to wrap the value in (e.g. apiKey). Leave empty for plaintext.
        required: false
        default: ""
      region:
        description: AWS region
        required: false
        default: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  create-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
          aws-region: ${{ inputs.region }}

      - name: Create or update secret
        id: secret
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
          JSON_KEY: ${{ inputs.secret_json_key }}
          REGION: ${{ inputs.region }}
          SECRET_VALUE: ${{ secrets.DOMINO_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::DOMINO_API_KEY repo secret is not set. Add it first: gh secret set DOMINO_API_KEY"
            exit 1
          fi
          echo "::add-mask::$SECRET_VALUE"
          if [ -n "$JSON_KEY" ]; then
            VALUE=$(python3 -c 'import json,sys; print(json.dumps({sys.argv[1]: sys.argv[2]}))' "$JSON_KEY" "$SECRET_VALUE")
          else
            VALUE="$SECRET_VALUE"
          fi
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "Secret already exists — updating value (new version)."
            aws secretsmanager put-secret-value --secret-id "$SECRET_NAME" --secret-string "$VALUE" --region "$REGION"
          else
            aws secretsmanager create-secret --name "$SECRET_NAME" --secret-string "$VALUE" --region "$REGION"
          fi
          ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region "$REGION" --query ARN --output text)
          echo "Secret ready: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
